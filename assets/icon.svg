<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e5e7eb;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGradient)" stroke="#ffffff" stroke-width="8"/>
  
  <!-- Main icon - AI/Enhancement symbol -->
  <g transform="translate(256, 256)">
    <!-- Central diamond/rhombus representing enhancement -->
    <path d="M0,-80 L60,0 L0,80 L-60,0 Z" fill="url(#iconGradient)" stroke="#1e40af" stroke-width="3"/>
    
    <!-- AI/Neural network nodes -->
    <circle cx="-40" cy="-40" r="8" fill="#ffffff"/>
    <circle cx="40" cy="-40" r="8" fill="#ffffff"/>
    <circle cx="-40" cy="40" r="8" fill="#ffffff"/>
    <circle cx="40" cy="40" r="8" fill="#ffffff"/>
    
    <!-- Connection lines -->
    <line x1="-40" y1="-40" x2="0" y2="-80" stroke="#ffffff" stroke-width="2"/>
    <line x1="40" y1="-40" x2="0" y2="-80" stroke="#ffffff" stroke-width="2"/>
    <line x1="-40" y1="40" x2="0" y2="80" stroke="#ffffff" stroke-width="2"/>
    <line x1="40" y1="40" x2="0" y2="80" stroke="#ffffff" stroke-width="2"/>
    
    <!-- Enhancement arrows -->
    <path d="M-20,-20 L20,-20 L20,20 L-20,20 Z" fill="none" stroke="#ffffff" stroke-width="2"/>
    <path d="M-10,-10 L10,-10 L10,10 L-10,10 Z" fill="#ffffff"/>
    
    <!-- Upload arrow -->
    <path d="M0,-100 L-15,-85 L15,-85 Z" fill="#ffffff"/>
    <line x1="0" y1="-100" x2="0" y2="-60" stroke="#ffffff" stroke-width="3"/>
  </g>
  
  <!-- App name -->
  <text x="256" y="420" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="24" font-weight="bold">AI Enhancer</text>
</svg>




